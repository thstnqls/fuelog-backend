spring:
  datasource:
    url: jdbc:h2:mem:fuelog-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
fuelog:
  auth:
    issuer: https://issuer.test
    jwk-set-uri: https://issuer.test/.well-known/jwks.json
    audience: fuelog-api
