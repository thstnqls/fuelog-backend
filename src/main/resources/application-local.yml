spring:
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/pleos_db}
    username: ${DB_USERNAME:pleos_user}
    password: ${DB_PASSWORD:pleos_pass_!2026}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing"

logging:
  level:
    app.fuelog: DEBUG
    org.hibernate.SQL: DEBUG
