spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/test}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    app.fuelog: DEBUG
    org.hibernate.SQL: DEBUG
