spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.local[.properties]
  application:
    name: fuelog-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

fuelog:
  charging:
    data-endpoint: ${DATA_ENDPOINT:}
    data-key: ${DATA_KEY:}
    pleos-coordinate-system: ${PLEOS_COORDINATE_SYSTEM:}
  auth:
    issuer: ${FUELOG_JWT_ISSUER:${SUPABASE_URL}/auth/v1}
    jwk-set-uri: ${FUELOG_JWK_SET_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
    audience: ${FUELOG_JWT_AUDIENCE:authenticated}
